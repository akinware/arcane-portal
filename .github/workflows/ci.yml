name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted, so pull requests from forks get the full checks too; it holds no secrets.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: akinware/gameport
          path: gameport-checkout
          persist-credentials: false
      - name: GamePortKit beside the app
        run: mv gameport-checkout ../gameport
      - name: Newest Xcode on the runner
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Publication inputs
        run: |
          python3 scripts/check_publication.py
          python3 scripts/check_localizations.py
      - name: Publication check regressions
        run: python3 -m unittest discover -s Tests/PublicationChecks
      - name: Swift tests
        run: swift test
      - name: Application regressions without UI
        run: |
          for check in Tests/CatalogAppChecks/run_*.py; do
            python3 "$check" || exit 1
          done
      - name: Release compilation
        run: swift build -c release --product NXLibrary
      - name: Package and verify development app
        run: |
          bash scripts/build_app.sh "$RUNNER_TEMP/NXLibrary.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/NXLibrary.app"
